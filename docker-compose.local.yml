# Explicit PostgreSQL local mode; secrets still come from your private .env.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yatra_kavach}
      POSTGRES_USER: ${POSTGRES_USER:-yatra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random PostgreSQL password in .env}
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./api
    env_file: .env
    environment:
      ENVIRONMENT: development
      PUBLIC_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-yatra}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-yatra_kavach}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-yatra}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-yatra_kavach}
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
  sweep:
    build: ./api
    env_file: .env
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-yatra}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-yatra_kavach}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-yatra}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-yatra_kavach}
    command: [python, -m, app.services.worker]
    depends_on:
      api:
        condition: service_healthy
volumes:
  local_postgres_data:
